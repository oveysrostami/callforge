[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "callforge"
version = "0.3.2"
description = "Local, resumable audio transcription pipeline orchestrated by Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "imageio-ffmpeg>=0.5",
  "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
callforge = "callforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
callforge = ["resources/**/*", "resources/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
